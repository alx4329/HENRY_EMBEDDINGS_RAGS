[project]
name = "clase3"
version = "0.1.0"
description = "Clase 3 - RAG (Retrieval-Augmented Generation) con arquitectura SOLID modular sobre dataset de cómics y canciones latinoamericanas"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.50.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.0.0",
    "ipykernel>=7.0.0",
    # Notebook de visualización de embeddings (notebooks/01_embeddings_visual_tour.ipynb)
    "matplotlib>=3.8.0",
    "scikit-learn>=1.5.0",
    "nbformat>=5.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts"]
extend-exclude = ["notebooks/*.ipynb"]  # los notebooks no se lintean

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]  # module level import not at top of file
"notebooks/_build_notebook.py" = ["RUF001"]  # signos matemáticos Unicode en prosa

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clase3"]
